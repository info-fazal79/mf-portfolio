name: Build and Deploy to cPanel Subdomain

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout Repository
      - name: Checkout Code
        uses: actions/checkout@v3

      # 2. Setup Node.js Environment
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'

      # 3. Install Dependencies & Build Frontend
      - name: Install Dependencies & Export Static Site
        run: |
          npm ci
          npm run build

      # 4. Prepare Deployment Bundle
      - name: Prepare Deployment Directory
        run: |
          mkdir -p deploy_me
          # Copy static frontend export contents to deploy_me
          if [ -d "out" ]; then
            cp -r out/* deploy_me/
          fi
          # Copy backend PHP code to deploy_me/api
          if [ -d "backend" ]; then
            mkdir -p deploy_me/api
            cp -r backend/* deploy_me/api/
          fi

      # 5. Deploy to cPanel Subdomain via Native Rsync (Secure)
      - name: Deploy via Native Rsync (Secure)
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          # Safely write the raw multiline SSH key, stripping any CRLF carriage returns
          printf "%s\n" "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
          # Scan host key and add to known_hosts
          ssh-keyscan -p 22 ${{ secrets.FTP_SERVER }} >> ~/.ssh/known_hosts
          
          # Sync files to cPanel subdomain
          rsync -avz -e "ssh -p 22 -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no" ./deploy_me/ ${{ secrets.FTP_USERNAME }}@${{ secrets.FTP_SERVER }}:/home/muhammadfz/mf.muhammadfazal.com/
