name: Build and Deploy to cPanel Subdomain

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout Repository
      - name: Checkout Code
        uses: actions/checkout@v3

      # 2. Setup Node.js Environment
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'

      # 3. Install Dependencies & Build Frontend
      - name: Install Dependencies & Export Static Site
        run: |
          npm ci
          npm run build

      # 4. Prepare Deployment Bundle
      - name: Prepare Deployment Directory
        run: |
          mkdir -p deploy_me
          # Copy static frontend export contents to deploy_me
          if [ -d "out" ]; then
            cp -r out/* deploy_me/
          fi
          # Copy backend PHP code to deploy_me/api
          if [ -d "backend" ]; then
            mkdir -p deploy_me/api
            cp -r backend/* deploy_me/api/
          fi

      # 5. Deploy to cPanel Subdomain via SSH (easingthemes/ssh-deploy)
      - name: SSH Deploy
        uses: easingthemes/ssh-deploy@v4.1.8
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.FTP_SERVER }}
          REMOTE_USER: ${{ secrets.FTP_USERNAME }}
          SOURCE: "deploy_me/"
          TARGET: "/home/muhammadfz/mf.muhammadfazal.com/"
